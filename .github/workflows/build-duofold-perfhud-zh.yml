name: Build Cyanide Duo Fold 中文 PerfHUD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Cyanide Duo Fold PerfHUD ZH
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download public submodules
        run: |
          git config submodule.Cyanide/tweaks/private.update none
          git submodule update --init --recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Apply PerfHUD patch
        run: python3 apply_perfhud.py .

      - name: Apply Duo Fold patch
        run: python3 apply_duofold.py .

      - name: Apply Gravity double-shake patch
        run: python3 apply_gravity_shake.py .

      - name: Relax Powercuff patch guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("apply_no_thermal_dim.py")
          s = p.read_text(encoding="utf-8")

          s = re.sub(
              r"def replace_once_or_already\(text: str, old: str, new: str, label: str\) -> str:\n.*?\n\n\ndef regex_once_or_already",
              '''def replace_once_or_already(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  print(f"[POWERCUFF-V3] already patched: {label}")
                  return text
              if old not in text:
                  print(f"[POWERCUFF-V3] skipped changed anchor: {label}")
                  return text
              print(f"[POWERCUFF-V3] patched: {label}")
              return text.replace(old, new, 1)


          def regex_once_or_already''',
              s,
              count=1,
              flags=re.S,
          )

          s = re.sub(
              r"def regex_once_or_already\(text: str, pattern: str, replacement: str, label: str, already: str\) -> str:\n.*?\n\n\ndef patch_powercuff_header",
              '''def regex_once_or_already(text: str, pattern: str, replacement: str, label: str, already: str) -> str:
              if already in text:
                  print(f"[POWERCUFF-V3] already patched: {label}")
                  return text
              out, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count == 0:
                  print(f"[POWERCUFF-V3] skipped changed regex anchor: {label}")
                  return text
              print(f"[POWERCUFF-V3] patched: {label}")
              return out


          def patch_powercuff_header''',
              s,
              count=1,
              flags=re.S,
          )

          p.write_text(s, encoding="utf-8")

          settings = Path("Cyanide/SettingsViewController.m")
          t = settings.read_text(encoding="utf-8")
          t = re.sub(
              r"(BOOL\s+needsSpringBoardWork\s*=\s*)(?!runPowercuff\s*\|\|\s*)",
              r"\1runPowercuff || ",
              t,
              count=1,
          )
          settings.write_text(t, encoding="utf-8")
          PY

      - name: Disable thermal screen dimming
        run: python3 apply_no_thermal_dim.py .

      - name: Apply Siri-style Notification Island patch
        run: python3 apply_notification_island_siri.py .

      - name: Apply Simplified Chinese patch
        run: python3 apply_zh_hans.py .

      - name: Build unsigned IPA
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cyanide-DuoFold-PerfHUD-ZH
          path: build/Cyanide.ipa
          retention-days: 7
